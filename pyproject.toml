[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seejob"
version = "0.1.0"
description = "Autonomous job application system — local-first orchestrator with human-in-the-loop gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SeeJob" }]
    dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "chromadb>=0.5.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
embeddings = [
    "sentence-transformers>=3.3.0",
]

[project.scripts]
seejob = "seejob.api.app:main"
seejob-sourcing = "seejob.workers.sourcing:main"

[tool.hatch.build.targets.wheel]
packages = ["seejob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
